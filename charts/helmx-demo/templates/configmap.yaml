apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "helmx-demo.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "helmx-demo.labels" . | nindent 4 }}
data:
  APP_ENV: {{ .Values.app.environment | quote }}
  LOG_LEVEL: {{ .Values.app.logLevel | quote }}
  SERVER_PORT: {{ .Values.config.serverPort | quote }}
  READ_TIMEOUT: {{ .Values.config.readTimeout | quote }}
  WRITE_TIMEOUT: {{ .Values.config.writeTimeout | quote }}
  CORS_ENABLED: {{ .Values.config.corsEnabled | quote }}
  FEATURE_DARK_MODE: {{ .Values.app.features.darkMode | quote }}
  FEATURE_METRICS: {{ .Values.app.features.metrics | quote }}
  FEATURE_HEALTH_CHECK: {{ .Values.app.features.healthCheck | quote }}
  index.html: |
    <!DOCTYPE html>
    <html>
    <head><title>helmx-demo</title></head>
    <body>
      <h1>{{ .Values.app.message }}</h1>
      <p>Environment: {{ .Values.app.environment }}</p>
      <p>Release: {{ .Release.Name }}</p>
      <p>Namespace: {{ .Release.Namespace }}</p>
      <p>Chart: {{ .Chart.Name }}-{{ .Chart.Version }}</p>
    </body>
    </html>
